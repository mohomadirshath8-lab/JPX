    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0d14;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-fantasy {
            font-family: 'Cinzel', serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0d14;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f97316;
        }
        /* Floating embers background animation */
        @keyframes floatEmbers {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }
        .ember {
            position: absolute;
            background: #f97316;
            border-radius: 50%;
            pointer-events: none;
            animation: floatEmbers 8s infinite linear;
        }
        .glow-text {
            text-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.15);

</head>

    <!-- Global Application State & JavaScript Logic -->
    <script>
        // --- DATABASE & LOCALSTORAGE INITIALIZATION ---
        const DEFAULT_STATE = {
            server: {
                ip: "play.jpxempire.net",
                online: true,
                players: 48,
                maxPlayers: 100,
                currentSeason: "Season 3: Riders of Berk Reloaded",
                seasonDurationDays: 45,
                seasonDaysElapsed: 30, // 1.5 months cycle
                nextSeasonName: "Season 4: The Hidden World",
                nextSeasonDate: "2026-05-15T00:00:00Z"
            },
            modpack: {
                name: "JPX-HTTYD-S3-Official.zip",
                version: "v3.8.2",
                size: "342 MB",
                downloads: 1420,
                directUrl: "#download-simulated",
                changelog: "Updated dragon AI, added custom saddle crafting recipes, balanced XP market tax rates."
            },
            marketListings: [
                { id: 1, seller: "ToothlessFan99", item: "Night Fury Scale x16", category: "Resources", priceText: "120 XP Points", priceValue: 120, contact: "Discord: Toothless#0001", status: "Active" },
                { id: 2, seller: "VikingKing", item: "Saddle of Monstrous Nightmare", category: "Gear", priceText: "45 Levels XP", priceValue: 90, contact: "Discord: Viking#4442", status: "Active" },
                { id: 3, seller: "DragonRider_X", item: "Gronckle Iron Ingots x64", category: "Resources", priceText: "250 XP Orbs", priceValue: 200, contact: "In-game Mail / /msg DragonRider_X", status: "Active" },
                { id: 4, seller: "Astrid_H", item: "Deadly Nadder Spine", category: "Rare Items", priceText: "500 XP Points", priceValue: 450, contact: "Discord: Astrid#8899", status: "Active" }
            ],
            premiumAccounts: [
                { id: 1, title: "Minecraft Java Full Access Account", description: "Unmigrated/Full Access with custom skin and Hypixel unbanned guarantee.", pointsCost: 2500, stock: 5, icon: "fa-gamepad" },
                { id: 2, title: "Minecraft Bedrock Edition Key", description: "Official Microsoft Store redeemable code for Windows/Console.", pointsCost: 1800, stock: 8, icon: "fa-cube" },
                { id: 3, title: "VIP Dragon Lord Rank (30 Days)", description: "In-game server rank with custom dragon mount commands and special perks.", pointsCost: 900, stock: 99, icon: "fa-crown" }
            ],
            user: {
                points: 350,
                wallet: 45.00
            },
            adminLoggedIn: false
        };

        function getAppState() {
            const stored = localStorage.getItem('jpx_empire_state');
            if (!stored) {
                localStorage.setItem('jpx_empire_state', JSON.stringify(DEFAULT_STATE));
                return DEFAULT_STATE;
            }
            try {
                return JSON.parse(stored);
            } catch (e) {
                return DEFAULT_STATE;
            }
        }

        function saveAppState(state) {
            localStorage.setItem('jpx_empire_state', JSON.stringify(state));
            updateHeaderBalances();
        }

        function updateHeaderBalances() {
            const state = getAppState();
            const pts = document.getElementById('user-points-display');
            const wlt = document.getElementById('user-wallet-display');
            const mPts = document.getElementById('mobile-user-points');
            const mWlt = document.getElementById('mobile-user-wallet');
            if (pts) pts.textContent = state.user.points;
            if (wlt) wlt.textContent = state.user.wallet.toFixed(2);
            if (mPts) mPts.textContent = state.user.points;
            if (mWlt) mWlt.textContent = state.user.wallet.toFixed(2);
        }

        // --- TOAST NOTIFICATION SYSTEM ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgCol = 'bg-dragon-card border-orange-500/50 text-white';
            let icon = 'fa-circle-check text-orange-500';
            if (type === 'error') {
                bgCol = 'bg-dragon-card border-red-500/50 text-white';
                icon = 'fa-circle-exclamation text-red-500';
            } else if (type === 'info') {
                bgCol = 'bg-dragon-card border-cyan-500/50 text-white';
                icon = 'fa-circle-info text-cyan-500';
            }

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border ${bgCol} shadow-xl backdrop-blur-md transform transition-all duration-300 translate-y-4 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            
            // Trigger animation in
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            // Remove after 3.5 seconds
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- COPY SERVER IP ---
        function copyServerIP() {
            const state = getAppState();
            const ip = state.server.ip;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(ip).then(() => {
                    showToast(`Server IP copied to clipboard: ${ip}`);
                }).catch(() => {
                    fallbackCopyIP(ip);
                });
            } else {
                fallbackCopyIP(ip);
            }
        }

        function fallbackCopyIP(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`Server IP copied: ${text}`);
            } catch (err) {
                showToast("Failed to copy IP. IP is: " + text, "error");
            }
            document.body.removeChild(textArea);
        }

        // --- BACKGROUND EMBERS GENERATOR ---
        function initEmbers() {
            const container = document.getElementById('embers-container');
            if (!container) return;
            const emberCount = 25;
            for (let i = 0; i < emberCount; i++) {
                const ember = document.createElement('div');
                ember.className = 'ember';
                const size = Math.random() * 4 + 2;
                ember.style.width = `${size}px`;
                ember.style.height = `${size}px`;
                ember.style.left = `${Math.random() * 100}%`;
                ember.style.bottom = `-20px`;
                ember.style.animationDuration = `${Math.random() * 6 + 6}s`;
                ember.style.animationDelay = `${Math.random() * 5}s`;
                if (Math.random() > 0.5) {
                    ember.style.background = '#fbbf24'; // gold ember
                }
                container.appendChild(ember);
            }
        }

        // --- CLIENT-SIDE ROUTER ---
        const router = {
            currentRoute: 'home',
            navigate: function(route) {
                this.currentRoute = route;
                window.location.hash = route;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });

                // Update active nav styling
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.getAttribute('data-route') === route) {
                        btn.classList.add('bg-dragon-border', 'text-white', 'border-orange-500/30');
                        btn.classList.remove('text-slate-300');
                    } else {
                        btn.classList.remove('bg-dragon-border', 'text-white', 'border-orange-500/30');
                        btn.classList.add('text-slate-300');
                    }
                });

                // Close mobile menu if open
                const mobileMenu = document.getElementById('mobile-menu');
                if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                    mobileMenu.classList.add('hidden');
                }
            },
            render: function() {
                const container = document.getElementById('app-content');
                if (!container) return;

                switch (this.currentRoute) {
                    case 'home':
                        container.innerHTML = renderHomePage();
                        break;
                    case 'market':
                        container.innerHTML = renderMarketPage();
                        break;
                    case 'modpack':
                        container.innerHTML = renderModpackPage();
                        break;
                    case 'store':
                        container.innerHTML = renderStorePage();
                        break;
                    case 'seasons':
                        container.innerHTML = renderSeasonsPage();
                        break;
                    case 'admin':
                        container.innerHTML = renderAdminPage();
                        break;
                    default:
                        container.innerHTML = renderHomePage();
                }
            }
        };

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        // --- PAGE RENDERERS ---

        // 1. HOME PAGE
        function renderHomePage() {
            const state = getAppState();
            return `
                <div class="space-y-12">
                    <!-- Hero Section -->
                    <div class="relative rounded-3xl overflow-hidden border border-dragon-border bg-gradient-to-b from-dragon-card to-dragon-dark p-8 sm:p-12 lg:p-16 text-center shadow-2xl glow-box">
                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(249,115,22,0.1)_0%,transparent_70%)] pointer-events-none"></div>
                        <div class="relative z-10 max-w-3xl mx-auto space-y-6">
                            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-orange-500/10 border border-orange-500/30 text-orange-400 text-xs font-semibold uppercase tracking-widest">
                                <i class="fa-solid fa-fire"></i> How To Train Your Dragon Modded Empire
                            </div>
                            <h1 class="text-4xl sm:text-6xl font-black text-white tracking-tight glow-text font-fantasy">
                                RIDE INTO THE <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-amber-400 to-yellow-300">DRAGON REALM</span>
                            </h1>
                            <p class="text-slate-300 text-base sm:text-lg leading-relaxed">
                                Welcome to <strong class="text-white">JPX Empire</strong>! Tame legendary dragons, build vast Viking kingdoms, and participate in our unique in-game lobby-linked trading market.
                            </p>
                            <div class="flex flex-wrap items-center justify-center gap-4 pt-4">
                                <button onclick="copyServerIP()" class="px-6 py-3.5 rounded-xl bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold shadow-lg shadow-orange-600/30 flex items-center gap-3 transition-all transform hover:scale-105">
                                    <i class="fa-solid fa-server text-lg"></i> Copy Server IP: ${state.server.ip}
                                </button>
                                <button onclick="router.navigate('modpack')" class="px-6 py-3.5 rounded-xl bg-dragon-card hover:bg-dragon-border border border-dragon-border text-white font-semibold flex items-center gap-3 transition-all">
                                    <i class="fa-solid fa-download text-emerald-400 text-lg"></i> Download Modpack
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Server Stats Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-dragon-card border border-dragon-border rounded-2xl p-6 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-2xl">
                                <i class="fa-solid fa-signal"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400 uppercase font-semibold">Server Status</p>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span class="text-white font-bold text-lg">Online & Stable</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-dragon-card border border-dragon-border rounded-2xl p-6 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-2xl">
                                <i class="fa-solid fa-users"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400 uppercase font-semibold">Active Riders</p>
                                <p class="text-white font-bold text-xl mt-1">${state.server.players} / ${state.server.maxPlayers}</p>
                            </div>
                        </div>

                        <div class="bg-dragon-card border border-dragon-border rounded-2xl p-6 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center text-orange-400 text-2xl">
                                <i class="fa-solid fa-dragon"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400 uppercase font-semibold">Current Season</p>
                                <p class="text-white font-bold text-sm mt-1 truncate max-w-[180px]">${state.server.currentSeason}</p>
                            </div>
                        </div>

            const state = getAppState();
            const query = document.getElementById('market-search').value.toLowerCase();
            const filtered = state.marketListings.filter(l => {
                const matchCat = currentCategoryFilter === 'All' || l.category === currentCategoryFilter;
                const matchQuery = l.item.toLowerCase().includes(query) || l.seller.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });
            const grid = document.getElementById('market-listings-grid');
            if (grid) grid.innerHTML = renderListingsCards(filtered);
        }

            const price = document.getElementById('listing-price').value;
            const contact = document.getElementById('listing-contact').value;

            const state = getAppState();
            const newListing = {

                seller,
                item,
                category,
                priceText: price,
                priceValue: 100,
                contact,
                status: 'Active'

            state.marketListings.unshift(newListing);
            saveAppState(state);
            closeCreateListingModal();
            router.render();
            showToast("Trade listing successfully published to the market!");

        function triggerDirectDownload() {
            const progressContainer = document.getElementById('download-progress-container');
            const progressBar = document.getElementById('download-progress-bar');
            const statusText = document.getElementById('download-status-text');
            const percentText = document.getElementById('download-percent-text');
            
            if (!progressContainer) return;
            progressContainer.classList.remove('hidden');

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 15) + 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    statusText.textContent = "Download complete! Check your downloads folder.";
                    statusText.className = "text-emerald-400 font-bold";
                    percentText.textContent = "100%";
                    progressBar.style.width = "100%";

                    // Increment download count in state
                    const state = getAppState();
                    state.modpack.downloads += 1;
                    saveAppState(state);
                    showToast("Modpack successfully downloaded!");
                } else {
                    progressBar.style.width = `${progress}%`;
                    percentText.textContent = `${progress}%`;
                    statusText.textContent = `Downloading package... (${progress}%)`;
                }
            }, 250);
        }

            if (state.user.points < acc.pointsCost) {
                showToast(`Insufficient points! You need ${acc.pointsCost} Points (You have ${state.user.points}).`, "error");

            if (acc.stock <= 0) {

                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-400 text-xs font-semibold uppercase tracking-widest">
                            <i class="fa-solid fa-hourglass-half"></i> Season Transitions & Coming Soon
                        </div>
                        <h2 class="text-3xl sm:text-4xl font-black text-white font-fantasy">JPX Empire Season Roadmap</h2>
                        <p class="text-slate-400 text-sm max-w-xl mx-auto">Each HTTYD season runs for approximately 1.5 months before transitioning into the next epic chapter.</p>
                    </div>

                    <!-- Active Season Card -->
                    <div class="bg-dragon-card border border-dragon-border rounded-3xl p-8 space-y-6 shadow-2xl">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div>
                                <span class="px-3 py-1 rounded-full text-xs font-bold uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Active Season</span>
                                <h3 class="text-2xl font-bold text-white mt-2">${state.server.currentSeason}</h3>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-slate-400 block">Duration Elapsed</span>
                                <span class="text-amber-400 font-bold text-lg">${state.server.seasonDaysElapsed} / ${state.server.seasonDurationDays} Days</span>
                            </div>
                        </div>
                        <div class="w-full h-3 bg-dragon-dark rounded-full overflow-hidden border border-dragon-border">
                            <div class="h-full bg-gradient-to-r from-orange-500 to-amber-500" style="width: ${(state.server.seasonDaysElapsed / state.server.seasonDurationDays) * 100}%"></div>
                        </div>
                    </div>

                    <!-- Coming Soon Next Season Teaser Card -->
                    <div class="relative rounded-3xl overflow-hidden border border-purple-500/30 bg-gradient-to-br from-purple-950/40 via-dragon-card to-dragon-dark p-8 sm:p-10 space-y-6 shadow-2xl glow-box">
                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(139,92,246,0.15)_0%,transparent_60%)] pointer-events-none"></div>
                        <div class="relative z-10 space-y-4">
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/20 border border-purple-500/40 text-purple-300 text-xs font-semibold uppercase tracking-widest">
                                <i class="fa-solid fa-clock">Coming Soon</i>
                            </div>
                            <h3 class="text-2xl sm:text-3xl font-black text-white font-fantasy">${state.server.nextSeasonName}</h3>
                            <p class="text-slate-300 text-sm leading-relaxed">
                                Get ready for brand new dragon species, hidden world biomes, custom quests, and exclusive trading market updates when Season 3 concludes!
                            </p>
                            <div class="pt-2 flex items-center gap-6">
                                <div class="bg-dragon-dark/80 border border-dragon-border px-6 py-4 rounded-2xl text-center">
                                    <span class="text-2xl sm:text-3xl font-black text-purple-400 font-fantasy">14</span>
                                    <span class="text-[10px] uppercase text-slate-400 block mt-1">Days Left</span>
                                </div>
                                <div class="bg-dragon-dark/80 border border-dragon-border px-6 py-4 rounded-2xl text-center">
                                    <span class="text-2xl sm:text-3xl font-black text-purple-400 font-fantasy">08</span>
                                    <span class="text-[10px] uppercase text-slate-400 block mt-1">Hours</span>
                                </div>
                                <div class="bg-dragon-dark/80 border border-dragon-border px-6 py-4 rounded-2xl text-center">
                                    <span class="text-2xl sm:text-3xl font-black text-purple-400 font-fantasy">42</span>
                                    <span class="text-[10px] uppercase text-slate-400 block mt-1">Minutes</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }


        // 6. ADMIN MANAGEMENT PANEL
        function renderAdminPage() {
            const state = getAppState();
            if (!state.adminLoggedIn) {
                return `
                    <div class="max-w-md mx-auto py-12">
                        <div class="bg-dragon-card border border-dragon-border rounded-3xl p-8 space-y-6 shadow-2xl">
                            <div class="text-center space-y-2">
                                <div class="w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-400 text-2xl mx-auto">
                                    <i class="fa-solid fa-shield-halved"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-white font-fantasy">Admin Authentication</h2>
                                <p class="text-slate-400 text-xs">Restricted area. Hidden from regular players.</p>
                            </div>
                            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Admin Passkey</label>
                                    <input type="password" id="admin-pass" required placeholder="Enter password (default: admin123)" class="w-full bg-dragon-dark border border-dragon-border rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-red-500">
                                </div>
                                <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold text-sm shadow-lg shadow-red-600/20 transition-all">
                                    Authenticate Admin
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="space-y-8">
                    <div class="flex items-center justify-between bg-dragon-card border border-dragon-border rounded-2xl p-6 sm:p-8">
                        <div>
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold uppercase tracking-widest mb-2">
                                <i class="fa-solid fa-shield-halved"></i> Administrator Mode
                            </div>
                            <h2 class="text-2xl font-black text-white font-fantasy">JPX Empire Control Center</h2>
                            <p class="text-slate-400 text-sm mt-1">Manage server settings, modpack direct downloads, market listings, and user points.</p>
                        </div>
                        <button onclick="handleAdminLogout()" class="px-4 py-2.5 rounded-xl bg-dragon-dark border border-dragon-border text-red-400 hover:bg-red-500/10 text-xs font-bold transition-all">
                            Logout Admin
                        </button>
                    </div>

                    <!-- Admin Tabs Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <!-- Modpack Manager -->
                        <div class="bg-dragon-card border border-dragon-border rounded-3xl p-6 sm:p-8 space-y-6">
                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-download text-emerald-400"></i> Update Modpack Direct Link
                            </h3>
                            <form onsubmit="handleUpdateModpack(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Modpack Filename</label>
                                    <input type="text" id="admin-mp-name" value="${state.modpack.name}" required class="w-full bg-dragon-dark border border-dragon-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Version</label>
                                        <input type="text" id="admin-mp-version" value="${state.modpack.version}" required class="w-full bg-dragon-dark border border-dragon-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">File Size</label>
                                        <input type="text" id="admin-mp-size" value="${state.modpack.size}" required class="w-full bg-dragon-dark border border-dragon-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Changelog Notes</label>
                                    <textarea id="admin-mp-changelog" rows="3" class="w-full bg-dragon-dark border border-dragon-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">${state.modpack.changelog}</textarea>
                                </div>
                                <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-600/20 transition-all">
                                    Save Modpack Update
                                </button>
                            </form>
                        </div>

                        <!-- Season / Server Manager -->
                        <div class="bg-dragon-card border border-dragon-border rounded-3xl p-6 sm:p-8 space-y-6">
                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-hourglass-half text-purple-400"></i> Season & Server Settings
                            </h3>
                            <form onsubmit="handleUpdateServer(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Current Season Name</label>
                                    <input type="text" id="admin-season-name" value="${state.server.currentSeason}" required class="w-full bg-dragon-dark border border-dragon-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Days Elapsed</label>
                                        <input type="number" id="admin-season-elapsed" value="${state.server.seasonDaysElapsed}" required class="w-full bg-dragon-dark border border-dragon-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Total Duration (Days)</label>
                                        <input type="number" id="admin-season-total" value="${state.server.seasonDurationDays}" required class="w-full bg-dragon-dark border border-dragon-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Next Season (Coming Soon)</label>
                                    <input type="text" id="admin-next-season" value="${state.server.nextSeasonName}" required class="w-full bg-dragon-dark border border-dragon-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                                </div>
                                <button type="submit" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm shadow-lg shadow-purple-600/20 transition-all">
                                    Update Season Settings
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Marketplace & User Management -->
                    <div class="bg-dragon-card border border-dragon-border rounded-3xl p-6 sm:p-8 space-y-6">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-scale-balanced text-amber-400"></i> Market Listings Management (${state.marketListings.length})
                            </h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="border-b border-dragon-border text-slate-400 text-xs uppercase">
                                    <tr>
                                        <th class="pb-3 px-4">Seller</th>
                                        <th class="pb-3 px-4">Item</th>
                                        <th class="pb-3 px-4">Category</th>
                                        <th class="pb-3 px-4">Price</th>
                                        <th class="pb-3 px-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-dragon-border/50">
                                    ${state.marketListings.map(l => `
                                        <tr>
                                            <td class="py-3 px-4 text-white font-medium">${l.seller}</td>
                                            <td class="py-3 px-4 text-slate-300">${l.item}</td>
                                            <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-orange-500/10 text-orange-400">${l.category}</span></td>
                                            <td class="py-3 px-4 text-amber-400 font-bold">${l.priceText}</td>
                                            <td class="py-3 px-4 text-right">
                                                <button onclick="adminDeleteListing(${l.id})" class="px-3 py-1 rounded bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white text-xs font-bold transition-all">
                                                    Delete
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123' || pass === 'jpx2026') {
                const state = getAppState();
                state.adminLoggedIn = true;
                saveAppState(state);
                router.render();
                showToast("Admin authenticated successfully!");
            } else {
                showToast("Invalid admin passkey!", "error");
            }
        }

        function handleAdminLogout() {
            const state = getAppState();
            state.adminLoggedIn = false;
            saveAppState(state);
            router.render();
            showToast("Logged out of admin panel.");
        }

        function handleUpdateModpack(e) {
            e.preventDefault();
            const name = document.getElementById('admin-mp-name').value;
            const version = document.getElementById('admin-mp-version').value;
            const size = document.getElementById('admin-mp-size').value;
            const changelog = document.getElementById('admin-mp-changelog').value;

            const state = getAppState();
            state.modpack.name = name;
            state.modpack.version = version;
            state.modpack.size = size;
            state.modpack.changelog = changelog;
            saveAppState(state);
            router.render();
            showToast("Modpack settings updated successfully!");
        }

        function handleUpdateServer(e) {
            e.preventDefault();
            const currentSeason = document.getElementById('admin-season-name').value;
            const seasonDaysElapsed = parseInt(document.getElementById('admin-season-elapsed').value);
            const seasonDurationDays = parseInt(document.getElementById('admin-season-total').value);
            const nextSeasonName = document.getElementById('admin-next-season').value;

            const state = getAppState();
            state.server.currentSeason = currentSeason;
            state.server.seasonDaysElapsed = seasonDaysElapsed;
            state.server.seasonDurationDays = seasonDurationDays;
            state.server.nextSeasonName = nextSeasonName;
            saveAppState(state);
            router.render();
            showToast("Season roadmap successfully updated!");
        }

        function adminDeleteListing(id) {
            const state = getAppState();
            state.marketListings = state.marketListings.filter(l => l.id !== id);
            saveAppState(state);
            router.render();
            showToast("Market listing removed by admin.");
        }

        // --- INITIALIZATION ON WINDOW LOAD ---
        window.onload = function() {
            initEmbers();
            updateHeaderBalances();

            // Determine route from hash or default to home
            const hash = window.location.hash.replace('#', '');
            if (['home', 'market', 'modpack', 'store', 'seasons', 'admin'].includes(hash)) {
                router.navigate(hash);
            } else {
                router.navigate('home');
            }
        };
    </script>
</body>
</html>
